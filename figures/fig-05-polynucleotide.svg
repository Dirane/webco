<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-label="Unlabeled diagram of two linked nucleotides in a polynucleotide strand with six numbered callouts">
<title>Polynucleotide strand (unlabeled)</title>
<style>
  .fx-f{font-family:'Source Sans 3',system-ui,sans-serif;font-size:21px;font-weight:600;fill:#1B1A2E}
  .fx-n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px;font-weight:500;fill:#fff}
  .fx-l{font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;font-weight:600;fill:#3D3591}
  .fx-lead{stroke:#9A96AD;stroke-width:1.4;fill:none}
</style>
<rect width="680" height="420" fill="#FBFAFD"/>

<g stroke="#4A4763" stroke-width="2.6" stroke-linecap="round" fill="none">
  <line x1="250" y1="96" x2="250" y2="64"/>
  <line x1="274" y1="128" x2="330" y2="137"/>
  <line x1="358" y1="186" x2="262" y2="242"/>
  <line x1="274" y1="273" x2="330" y2="282"/>
  <line x1="409" y1="137" x2="442" y2="150"/>
  <line x1="409" y1="282" x2="442" y2="295"/>
  <line x1="370" y1="331" x2="370" y2="360"/>
</g>

<!-- phosphates -->
<circle cx="250" cy="120" r="24" fill="#EDEBF9" stroke="#3D3591" stroke-width="2.2"/>
<text class="fx-f" x="250" y="128" text-anchor="middle" fill="#3D3591">P</text>
<circle cx="250" cy="265" r="24" fill="#EDEBF9" stroke="#3D3591" stroke-width="2.2"/>
<text class="fx-f" x="250" y="273" text-anchor="middle" fill="#3D3591">P</text>

<!-- sugars -->
<polygon points="370,108 409.9,137 394.7,184 345.3,184 330.1,137" fill="#FFFFFF" stroke="#4A4763" stroke-width="2.2"/>
<polygon points="370,253 409.9,282 394.7,329 345.3,329 330.1,282" fill="#FFFFFF" stroke="#4A4763" stroke-width="2.2"/>

<!-- bases -->
<rect x="442" y="122" width="104" height="56" rx="11" fill="#FBEDF2" stroke="#C74F7B" stroke-width="2"/>
<text class="fx-f" x="494" y="158" text-anchor="middle" fill="#B03F6A">A</text>
<rect x="442" y="267" width="104" height="56" rx="11" fill="#FBEDF2" stroke="#C74F7B" stroke-width="2"/>
<text class="fx-f" x="494" y="303" text-anchor="middle" fill="#B03F6A">G</text>

<text class="fx-f" x="402" y="372" font-size="18" fill="#4A4763">OH</text>

<!-- callouts -->
<path class="fx-lead" d="M160 106 L228 116"/>
<g><circle cx="146" cy="102" r="15" fill="#3D3591"/><text class="fx-n" x="146" y="107" text-anchor="middle">1</text></g>
<text class="fx-l" data-lbl="1" opacity="0" x="146" y="70" text-anchor="middle">Phosphate group</text>

<path class="fx-lead" d="M434 208 L396 186"/>
<g><circle cx="448" cy="214" r="15" fill="#3D3591"/><text class="fx-n" x="448" y="219" text-anchor="middle">2</text></g>
<text class="fx-l" data-lbl="2" opacity="0" x="470" y="220" text-anchor="start">Pentose sugar</text>

<path class="fx-lead" d="M586 150 L550 150"/>
<g><circle cx="600" cy="150" r="15" fill="#3D3591"/><text class="fx-n" x="600" y="155" text-anchor="middle">3</text></g>
<text class="fx-l" data-lbl="3" opacity="0" x="600" y="112" text-anchor="middle">Nitrogenous base</text>

<path class="fx-lead" d="M166 203 L308 212"/>
<g><circle cx="152" cy="200" r="15" fill="#3D3591"/><text class="fx-n" x="152" y="205" text-anchor="middle">4</text></g>
<text class="fx-l" data-lbl="4" opacity="0" x="152" y="168" text-anchor="middle">Phosphodiester linkage</text>

<path class="fx-lead" d="M250 56 L250 64"/>
<g><circle cx="250" cy="41" r="15" fill="#3D3591"/><text class="fx-n" x="250" y="46" text-anchor="middle">5</text></g>
<text class="fx-l" data-lbl="5" opacity="0" x="274" y="47" text-anchor="start">5′ end (free phosphate)</text>

<path class="fx-lead" d="M370 377 L370 362"/>
<g><circle cx="370" cy="392" r="15" fill="#3D3591"/><text class="fx-n" x="370" y="397" text-anchor="middle">6</text></g>
<text class="fx-l" data-lbl="6" opacity="0" x="394" y="398" text-anchor="start">3′ end (free —OH)</text>
</svg>
